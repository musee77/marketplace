{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="wrap" style="display:flex;justify-content:center;">
    <div class="panel" style="max-width:560px;text-align:center;">
      <div class="eyebrow">Signed out</div>
      <h2>You are now logged out</h2>
      <p class="helptext" style="margin-bottom:20px;">Your session has ended. You can go back to the home page or log in again when you're ready.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <a href="{% url 'core:home' %}" class="btn btn-outline">Home</a>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
