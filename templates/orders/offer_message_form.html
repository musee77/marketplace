{% extends "base.html" %}
{% block title %}{{ title }} — Synovae Analytics{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap" style="max-width:700px;">
    <div class="section-head">
      <h2>{{ title }}</h2>
      <a href="{% url 'chat:conversation' offer_message.conversation_id %}" class="btn btn-outline btn-sm">Back to chat</a>
    </div>
    <form method="post" class="panel">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save offer</button>
    </form>
  </div>
</section>
{% endblock %}
